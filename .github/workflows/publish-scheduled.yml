name: Publish scheduled post

# Every morning at 09:17 Istanbul time, move the posts whose publishDate has passed from queue/ into
# src/content/blog/, check that the site still builds, then commit and push. Cloudflare Workers Builds
# deploys every push to main, so the new post goes live a few minutes later.
on:
  schedule:
    - cron: '17 6 * * *' # 09:17 Europe/Istanbul
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Europe/Istanbul

concurrency:
  group: publish-scheduled-post
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Move due posts out of the queue
        id: queue
        run: node scripts/publish-due.mjs
      - name: Check the site still builds
        if: steps.queue.outputs.published == 'true'
        run: |
          npm ci
          npm run build
      - name: Commit and push
        if: steps.queue.outputs.published == 'true'
        env:
          TITLES: ${{ steps.queue.outputs.titles }}
        run: |
          git config user.name "blog-publisher[bot]"
          git config user.email "blog-publisher[bot]@users.noreply.github.com"
          git add -A queue src/content/blog
          git commit -m "Publish scheduled post for $(date +%F): $TITLES"
          git push
