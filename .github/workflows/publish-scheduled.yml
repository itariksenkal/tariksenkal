name: Publish scheduled post

# Every morning at 09:17 Istanbul time, move the posts whose publishDate has passed from queue/ into
# src/content/blog/, check that the site still builds, commit and push, then deploy to Cloudflare.
# (Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploying happens here.)
on:
  schedule:
    - cron: '17 6 * * *' # 09:17 Europe/Istanbul
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Europe/Istanbul

concurrency:
  group: publish-scheduled-post
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Move due posts out of the queue
        id: queue
        run: node scripts/publish-due.mjs
      - name: Check the site still builds
        if: steps.queue.outputs.published == 'true'
        run: |
          npm ci
          npm run build
      - name: Commit and push
        if: steps.queue.outputs.published == 'true'
        env:
          TITLES: ${{ steps.queue.outputs.titles }}
        run: |
          git config user.name "blog-publisher[bot]"
          git config user.email "blog-publisher[bot]@users.noreply.github.com"
          git add -A queue src/content/blog
          git commit -m "Publish scheduled post for $(date +%F): $TITLES"
          git push
      - name: Deploy to Cloudflare
        id: deploy
        if: steps.queue.outputs.published == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Notify search engines (IndexNow)
        if: steps.deploy.outcome == 'success'
        run: node scripts/indexnow.mjs
